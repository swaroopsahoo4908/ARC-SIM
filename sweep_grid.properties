# Full-factorial sweep grid for FullFactorialSweep (Engine 1).
#
# Default grid: 145,530 combinations (45 wind x 7 turbulence x 11 temp x 7 pressure x 3 rod x 2 sites).
#
# windStdDev and windDir are held at a single value on purpose. Measured on CSWARCMOD1E with OpenRocket 24.12:
#  - windStdDev is not read by the multi-level wind model ARC-SIM uses (the gust level comes from turbulencePct),
#    so changing it moves apogee by exactly 0.0000 m.
#  - windDir moves apogee by under 0.05 m, because launch-into-wind tilts the rod toward the wind.
# Widen either axis only if you change the wind model; each extra value multiplies runtime.

windAvg.min=0
windAvg.max=22
windAvg.step=0.5

windStdDev.min=0
windStdDev.max=0
windStdDev.step=1.0

turbulencePct.min=0
turbulencePct.max=60
turbulencePct.step=10

windDir.min=0
windDir.max=0
windDir.step=10

temp.min=-10
temp.max=40
temp.step=5

pressure.min=970
pressure.max=1030
pressure.step=10

rodAngle.min=0
rodAngle.max=6
rodAngle.step=3

sites=MDRA_SOD_FARM,SPAAR_LANCASTER

# Pass/fail targets used for the meets_apogee / meets_time / meets_both columns and the leaderboard.
targetApogeeM=243.84
apogeeToleranceM=0.25
targetTimeS=38.5
timeToleranceS=1.0

# Wind gusts are random. Each grid index derives its own seed from baseSeed, so a sweep repeats exactly.
# Change baseSeed to draw a different (equally valid) set of gusts.
baseSeed=20260101

maxCombosSafety=50000000

# Refuse to start if the calibrated estimate exceeds this many hours (0 = no limit). --force overrides.
maxHoursSafety=0

threads=8
