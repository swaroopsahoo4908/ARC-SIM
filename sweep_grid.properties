# Full-factorial sweep grid for FullFactorialSweep (Engine 1).
# Every combination of every axis below gets simulated -- no sampling, no skipping.
#
# Your originally-requested increments (0.5 m/s wind, 0.1 m/s std dev, 1% turbulence,
# 0.5 deg direction, 1 deg C, 1 mbar) produce ~388 BILLION combinations -- not runnable
# (see chat: ~369 years on one CPU core). The defaults below produce ~37 million
# combinations -- wider ranges and finer resolution than the original 1.6M-combo default,
# while remaining tractable (roughly a day and a half on an 8-thread machine at the
# ~30ms/sim nominal estimate; faster on more cores). Run the tool once first -- it
# prints the total combination count and a rough time estimate BEFORE it starts, so you
# can Ctrl+C and adjust before committing to a multi-hour/multi-day run.
#
# Tune these for your own time budget: coarsen any axis below to cut runtime, or push
# further if you have the core-hours to spend.

windAvg.min=0
windAvg.max=22
windAvg.step=0.5

windStdDev.min=0
windStdDev.max=6
windStdDev.step=1.0

turbulencePct.min=0
turbulencePct.max=60
turbulencePct.step=10

windDir.min=0
windDir.max=350
windDir.step=10

temp.min=-10
temp.max=40
temp.step=5

pressure.min=970
pressure.max=1030
pressure.step=10

# Launch rod/rail tilt from vertical, degrees (0 = vertical). The rod is always pointed into
# the prevailing wind direction (see SimRunner), so only the wind-relative tilt angle is swept
# here rather than an independent absolute rod heading, which would only add redundant,
# symmetric combinations.
rodAngle.min=0
rodAngle.max=6
rodAngle.step=3

sites=MDRA_SOD_FARM,SPAAR_LANCASTER

# Safety cap: refuses to run above this many combinations unless --force is passed.
# Raised from the prior 5,000,000 to accommodate the wider/finer default grid above (~37M).
maxCombosSafety=50000000

# Worker threads. Defaults to available CPU cores if omitted.
threads=8
